<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <!-- Engine Bay Background Context -->
  <path d="M 50,50 L 750,50 L 700,550 L 100,550 Z" fill="#090D15" stroke="#1E293B" stroke-width="2" />
  
  <!-- Airbox Assembly -->
  <g id="step1_housing">
    <rect x="220" y="140" width="360" height="340" rx="20" fill="url(#boxGrad)" stroke="#38BDF8" stroke-width="3" />
    <text x="400" y="200" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" text-anchor="middle">AIR CLEANER HOUSING</text>
    <text x="400" y="230" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#94A3B8" text-anchor="middle">Toyota Publication OM42C33U</text>

    <!-- Structural Ribs -->
    <line x1="260" y1="280" x2="540" y2="280" stroke="#334155" stroke-width="4" />
    <line x1="260" y1="340" x2="540" y2="340" stroke="#334155" stroke-width="4" />
    <line x1="260" y1="400" x2="540" y2="400" stroke="#334155" stroke-width="4" />

    <!-- Latches in LOCKED Position (Step 1) -->
    <g transform="translate(580, 240)">
      <rect x="0" y="0" width="22" height="45" rx="5" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
      <circle cx="11" cy="22" r="4" fill="#38BDF8" />
    </g>
    <g transform="translate(580, 370)">
      <rect x="0" y="0" width="22" height="45" rx="5" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
      <circle cx="11" cy="22" r="4" fill="#38BDF8" />
    </g>

    <!-- Intake Duct Tube -->
    <path d="M 400,140 Q 400,80 560,80" fill="none" stroke="#1E293B" stroke-width="56" stroke-linecap="round" />
  </g>

  <!-- Step 1 Target Reticle -->
  <circle cx="400" cy="310" r="220" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="14 14" opacity="0.8" />
  <rect x="300" y="520" width="200" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <text x="400" y="543" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#38BDF8" text-anchor="middle">STEP 1: LOCATED</text>
</svg>
