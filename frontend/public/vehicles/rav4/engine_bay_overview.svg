<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
    <linearGradient id="engineBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263147" />
      <stop offset="100%" stop-color="#171E2E" />
    </linearGradient>
    <linearGradient id="airboxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pinkCoolant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Engine Bay Body Structure -->
  <rect width="1200" height="800" fill="url(#bayBg)" />
  <path d="M 50,50 L 1150,50 L 1100,750 L 100,750 Z" fill="#0C1017" stroke="#1E293B" stroke-width="4" />
  
  <!-- Firewall / Cowl Grid Lines -->
  <line x1="100" y1="120" x2="1100" y2="120" stroke="#1E293B" stroke-dasharray="8 8" />
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#1E293B" stroke-dasharray="4 4" />

  <!-- Engine Block Center (A25A-FKS 2.5L Dynamic Force) -->
  <rect x="420" y="240" width="360" height="380" rx="20" fill="url(#engineBlock)" stroke="#334155" stroke-width="3" />
  <text x="600" y="320" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#94A3B8" text-anchor="middle" letter-spacing="2">TOYOTA</text>
  <text x="600" y="350" font-family="'Inter', sans-serif" font-weight="500" font-size="14" fill="#38BDF8" text-anchor="middle" letter-spacing="3">DYNAMIC FORCE</text>

  <!-- Valve Cover Accents -->
  <line x1="460" y1="390" x2="740" y2="390" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="460" y1="430" x2="740" y2="430" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="460" y1="470" x2="740" y2="470" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Oil Filler Cap (0W-16) -->
  <circle cx="700" cy="380" r="28" fill="#F59E0B" stroke="#B45309" stroke-width="4" />
  <text x="700" y="385" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#0F172A" text-anchor="middle">0W-16</text>

  <!-- Engine Air Cleaner Assembly (Driver Front Corner) -->
  <!-- Target Component for Showcase -->
  <g id="air-cleaner-box">
    <rect x="180" y="260" width="220" height="260" rx="16" fill="url(#airboxGrad)" stroke="#38BDF8" stroke-width="2.5" />
    <text x="290" y="300" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#F8FAFC" text-anchor="middle">AIR CLEANER</text>
    <text x="290" y="320" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#94A3B8" text-anchor="middle">17801-F0050</text>
    
    <!-- Housing Ribs -->
    <line x1="210" y1="350" x2="370" y2="350" stroke="#334155" stroke-width="3" />
    <line x1="210" y1="390" x2="370" y2="390" stroke="#334155" stroke-width="3" />
    <line x1="210" y1="430" x2="370" y2="430" stroke="#334155" stroke-width="3" />

    <!-- Spring Retaining Latches on Right Side -->
    <rect x="395" y="320" width="16" height="32" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
    <rect x="395" y="440" width="16" height="32" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />

    <!-- Intake Air Tube to MAF Sensor -->
    <path d="M 330,260 Q 360,180 480,180 L 520,180" fill="none" stroke="#1E293B" stroke-width="48" stroke-linecap="round" />
    <!-- MAF Sensor Collar -->
    <rect x="440" y="156" width="50" height="48" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />
    <text x="465" y="185" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">MAF</text>
  </g>

  <!-- Coolant Expansion Tank (Front Left Edge) -->
  <g id="coolant-tank">
    <rect x="130" y="550" width="150" height="170" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <rect x="145" y="600" width="120" height="105" rx="8" fill="url(#pinkCoolant)" opacity="0.85" />
    <text x="205" y="580" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#FDA4AF" text-anchor="middle">COOLANT</text>
    <text x="205" y="660" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">FULL</text>
  </g>

  <!-- 12V Auxiliary Battery (Front Right Corner) -->
  <g id="aux-battery">
    <rect x="850" y="440" width="220" height="240" rx="12" fill="#0F172A" stroke="#475569" stroke-width="3" />
    <rect x="880" y="415" width="40" height="25" rx="4" fill="#EF4444" />
    <text x="900" y="432" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFF" text-anchor="middle">+</text>
    <rect x="1000" y="415" width="40" height="25" rx="4" fill="#3B82F6" />
    <text x="1020" y="432" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FFF" text-anchor="middle">-</text>
    <text x="960" y="540" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#94A3B8" text-anchor="middle">12V BATTERY</text>
    <text x="960" y="570" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#64748B" text-anchor="middle">LN2-MF / 60Ah</text>
  </g>

  <!-- Brake Master Cylinder & Fluid Reservoir (Rear Driver Firewall - Safety Guarded) -->
  <g id="brake-reservoir">
    <rect x="870" y="120" width="160" height="150" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 3" />
    <circle cx="950" cy="195" r="30" fill="#FEF08A" opacity="0.8" />
    <text x="950" y="150" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#F87171" text-anchor="middle">BRAKE FLUID</text>
    <text x="950" y="200" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#713F12" text-anchor="middle">DOT 3/4</text>
    <text x="950" y="250" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#EF4444" text-anchor="middle">SAFETY SHIELDED</text>
  </g>

  <!-- Reticle Overlay for HUD Targeting -->
  <circle cx="290" cy="390" r="140" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.6" />
  <line x1="290" y1="230" x2="290" y2="250" stroke="#38BDF8" stroke-width="2" />
  <line x1="290" y1="530" x2="290" y2="550" stroke="#38BDF8" stroke-width="2" />
  <line x1="130" y1="390" x2="150" y2="390" stroke="#38BDF8" stroke-width="2" />
  <line x1="430" y1="390" x2="450" y2="390" stroke="#38BDF8" stroke-width="2" />
</svg>
