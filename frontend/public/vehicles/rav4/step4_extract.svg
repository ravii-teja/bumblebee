<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="dirtyFilter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78716C" />
      <stop offset="50%" stop-color="#44403C" />
      <stop offset="100%" stop-color="#57534E" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <path d="M 50,50 L 750,50 L 700,550 L 100,550 Z" fill="#090D15" stroke="#1E293B" stroke-width="2" />

  <!-- Empty Lower Airbox Tray -->
  <rect x="180" y="280" width="300" height="190" rx="14" fill="#020617" stroke="#334155" stroke-width="3" stroke-dasharray="4 4" />
  <text x="330" y="380" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#64748B" text-anchor="middle">EMPTY LOWER TRAY</text>
  <text x="330" y="405" font-family="'Inter', sans-serif" font-weight="400" font-size="11" fill="#475569" text-anchor="middle">Check for leaves or dust</text>

  <!-- Old Extracted Filter Element (Held above) -->
  <g transform="translate(420, 140) rotate(10)">
    <rect x="0" y="0" width="280" height="170" rx="10" fill="url(#dirtyFilter)" stroke="#EF4444" stroke-width="3" />
    <!-- Dirty Pleat Lines -->
    <line x1="30" y1="0" x2="30" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="60" y1="0" x2="60" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="90" y1="0" x2="90" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="120" y1="0" x2="120" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="150" y1="0" x2="150" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="180" y1="0" x2="180" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="210" y1="0" x2="210" y2="170" stroke="#292524" stroke-width="3" />
    <line x1="240" y1="0" x2="240" y2="170" stroke="#292524" stroke-width="3" />
    <text x="140" y="90" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#FCA5A5" text-anchor="middle">DIRTY ELEMENT REMOVED</text>
  </g>

  <rect x="260" y="520" width="280" height="36" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
  <text x="400" y="543" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#EF4444" text-anchor="middle">STEP 4: OLD FILTER EXTRACTED</text>
</svg>
