<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="filterMedia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <path d="M 50,50 L 750,50 L 700,550 L 100,550 Z" fill="#090D15" stroke="#1E293B" stroke-width="2" />

  <!-- Lower Airbox Tray -->
  <rect x="220" y="240" width="360" height="240" rx="16" fill="#0F172A" stroke="#334155" stroke-width="3" />

  <!-- Exposed Air Cleaner Element (In Lower Tray) -->
  <rect x="240" y="260" width="320" height="200" rx="12" fill="url(#filterMedia)" stroke="#F59E0B" stroke-width="3" />
  <!-- Pleat Lines -->
  <line x1="270" y1="260" x2="270" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="300" y1="260" x2="300" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="330" y1="260" x2="330" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="360" y1="260" x2="360" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="390" y1="260" x2="390" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="420" y1="260" x2="420" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="450" y1="260" x2="450" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="480" y1="260" x2="480" y2="460" stroke="#94A3B8" stroke-width="2" />
  <line x1="510" y1="260" x2="510" y2="460" stroke="#94A3B8" stroke-width="2" />

  <!-- Lifted Upper Lid (Propped at angle) -->
  <polygon points="220,240 580,110 590,130 230,260" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
  <text x="410" y="150" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#38BDF8" transform="rotate(-18 410 150)">UPPER LID ELEVATED</text>

  <rect x="270" y="520" width="260" height="36" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <text x="400" y="543" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#38BDF8" text-anchor="middle">STEP 3: HOUSING LID LIFTED</text>
</svg>
