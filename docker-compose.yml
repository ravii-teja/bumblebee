version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muse-field-backend
    ports:
      - "8000:8000"
    environment:
      - META_API_KEY=${META_API_KEY:-}
      - META_API_ENDPOINT=${META_API_ENDPOINT:-https://api.meta.ai/v1/chat/completions}
      - META_MODEL_NAME=${META_MODEL_NAME:-muse-wonder-1.0}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muse-field-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev
